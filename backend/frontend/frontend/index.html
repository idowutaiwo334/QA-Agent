<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Q&A Agent</title>
<style>
  :root {
    --ink: #1b1a17;
    --paper: #faf8f4;
    --panel: #ffffff;
    --line: #e4e0d6;
    --accent: #2d5c4e;
    --accent-soft: #e8f0ec;
    --muted: #8a8578;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Iowan Old Style', 'Georgia', serif;
    background: var(--paper);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 22px 28px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  header h1 {
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: 0.01em;
    font-weight: 600;
  }

  header span {
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0 120px;
  }

  .thread {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 28px;
  }

  .msg {
    margin-bottom: 22px;
    animation: rise 0.25s ease;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg .role {
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .msg.user .role { color: var(--accent); }

  .msg .bubble {
    font-size: 1rem;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: var(--accent-soft);
    padding: 10px 16px;
    border-radius: 3px;
    display: inline-block;
  }

  .sources {
    margin-top: 8px;
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }

  .sources span {
    border: 1px solid var(--line);
    padding: 2px 8px;
    border-radius: 20px;
    margin-right: 6px;
    display: inline-block;
    margin-top: 4px;
  }

  .empty-state {
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    color: var(--muted);
    padding: 0 28px;
  }

  .empty-state h2 {
    color: var(--ink);
    font-size: 1.3rem;
    margin-bottom: 8px;
  }

  footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, var(--paper) 60%, transparent);
    padding: 24px 0 28px;
  }

  form {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 28px;
    display: flex;
    gap: 10px;
  }

  textarea {
    flex: 1;
    resize: none;
    font-family: inherit;
    font-size: 1rem;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    line-height: 1.4;
    max-height: 140px;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--accent);
    color: white;
    border: none;
    padding: 0 22px;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: default; }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.1s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>Q&amp;A Agent</h1>
  <span>grounded in your documents</span>
</header>

<main>
  <div class="thread" id="thread">
    <div class="empty-state" id="empty-state">
      <h2>Ask anything about your documents</h2>
      <p>Answers are generated only from what's been ingested into the knowledge base.</p>
    </div>
  </div>
</main>

<footer>
  <form id="chat-form">
    <textarea id="question" rows="1" placeholder="Ask a question…" autofocus></textarea>
    <button type="submit" id="send-btn">Ask</button>
  </form>
</footer>

<script>
  const thread = document.getElementById('thread');
  const emptyState = document.getElementById('empty-state');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('question');
  const sendBtn = document.getElementById('send-btn');

  function addMessage(role, text) {
    emptyState.style.display = 'none';
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;
    msg.innerHTML = `<div class="role">${role === 'user' ? 'You' : 'Agent'}</div><div class="bubble"></div>`;
    msg.querySelector('.bubble').textContent = text;
    thread.appendChild(msg);
    window.scrollTo(0, document.body.scrollHeight);
    return msg;
  }

  function addSources(msgEl, sources) {
    if (!sources || sources.length === 0) return;
    const div = document.createElement('div');
    div.className = 'sources';
    div.innerHTML = sources.map(s => `<span>${s}</span>`).join('');
    msgEl.appendChild(div);
  }

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage('user', question);
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    const loadingMsg = addMessage('agent', '');
    loadingMsg.querySelector('.bubble').innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();

      if (!res.ok) {
        loadingMsg.querySelector('.bubble').textContent = `Error: ${data.detail || 'Something went wrong.'}`;
      } else {
        loadingMsg.querySelector('.bubble').textContent = data.answer;
        addSources(loadingMsg, data.sources);
      }
    } catch (err) {
      loadingMsg.querySelector('.bubble').textContent = 'Could not reach the server. Is it running?';
    } finally {
      sendBtn.disabled = false;
      window.scrollTo(0, document.body.scrollHeight);
    }
  });
</script>

</body>
</html>
